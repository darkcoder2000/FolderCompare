name: Rust

permissions:
  contents: read

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install eframe build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Release builds of every push, downloadable from the run's "Artifacts" section (no GitHub release, no tag).
  publish:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: win-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install eframe build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-${{ matrix.target }}
      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$version-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cargo build --release --locked -p foldercompare --target ${{ matrix.target }}
      # Artifacts are zipped on download and lose the executable bit, so Linux/macOS builds go into an archive.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p assets
          cp target/${{ matrix.target }}/release/FolderCompare.exe assets/FolderCompare.exe
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p assets
          tar -czf "assets/FolderCompare-${{ steps.version.outputs.label }}-linux-x64.tar.gz" \
            -C target/${{ matrix.target }}/release FolderCompare
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p assets bundle
          bash build/macos/make-app.sh target/${{ matrix.target }}/release/FolderCompare "${{ steps.version.outputs.version }}" bundle
          ditto -c -k --keepParent bundle/FolderCompare.app "assets/FolderCompare-${{ steps.version.outputs.label }}-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: FolderCompare-${{ steps.version.outputs.label }}-${{ matrix.name }}
          path: assets/*
          if-no-files-found: error
          retention-days: 30

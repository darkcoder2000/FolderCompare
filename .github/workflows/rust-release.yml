name: Rust release

# Push an annotated tag v2.X.Y (message = release notes) to build all platforms and create a DRAFT release.
# Review the draft on GitHub and publish it manually.
on:
  push:
    tags: ['v2.*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: win-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install eframe build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          echo "Cargo version: $version, tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::version in Cargo.toml ($version) does not match the tag ($tag)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --workspace --release

      - name: Build
        run: cargo build --release --locked -p foldercompare --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p assets
          cp target/${{ matrix.target }}/release/FolderCompare.exe assets/FolderCompare.exe
          (cd target/${{ matrix.target }}/release && 7z a -tzip "../../../assets/FolderCompare-${{ steps.version.outputs.version }}-win-x64.zip" FolderCompare.exe)

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p assets
          tar -czf "assets/FolderCompare-${{ steps.version.outputs.version }}-linux-x64.tar.gz" \
            -C target/${{ matrix.target }}/release FolderCompare

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p assets bundle
          bash build/macos/make-app.sh target/${{ matrix.target }}/release/FolderCompare "${{ steps.version.outputs.version }}" bundle
          ditto -c -k --keepParent bundle/FolderCompare.app "assets/FolderCompare-${{ steps.version.outputs.version }}-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.name }}
          path: assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          path: assets
          merge-multiple: true

      - name: Checksums
        run: (cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Release notes from the tag message
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
          if [ -f "docs/release-notes/${GITHUB_REF_NAME#v}.md" ]; then cp "docs/release-notes/${GITHUB_REF_NAME#v}.md" release-notes.md; fi
          cat release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --title "FolderCompare ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --draft
